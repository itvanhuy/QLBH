# ============================================================
# APPLICATION CONFIGURATION
# Restaurant Management System - Spring Boot 3.2.x
# ============================================================

# Server
server.port=8080
spring.application.name=restaurant-backend

# ============================================================
# DATABASE - MySQL
# Thay đổi username/password cho phù hợp với máy của bạn
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP - mặc định của Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
# validate: kiểm tra schema khớp với entity (dùng khi đã có schema.sql)
# update: tự động cập nhật schema (dùng khi dev, KHÔNG dùng production)
# none: không làm gì với schema
spring.jpa.hibernate.ddl-auto=validate

# Hiển thị SQL ra console (tắt ở production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Tắt Open Session In View (tránh lazy loading issues)
spring.jpa.open-in-view=false

# ============================================================
# JWT CONFIGURATION
# QUAN TRỌNG: Đổi jwt.secret thành chuỗi ngẫu nhiên dài ≥ 32 ký tự
# trước khi deploy production
# ============================================================
jwt.secret=RestaurantManagementSystemSecretKey2024VeryLongAndSecure
jwt.expiration=86400000

# 86400000 ms = 24 giờ (phù hợp cho development)
# Production nên dùng 3600000 ms = 1 giờ

# ============================================================
# MULTIPART FILE UPLOAD (cho upload ảnh món ăn)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# LOGGING
# ============================================================
logging.level.com.restaurant=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Tắt log SQL parameters ở production
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# JACKSON - Serialize/Deserialize JSON
# ============================================================
# Không trả về field null trong response
spring.jackson.default-property-inclusion=non_null
# Format ngày giờ theo ISO 8601
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
